#cloud-config
package_update: true
package_upgrade: true

packages:
  - docker.io
  - git
  - curl
  - sqlite3

# Install Docker Compose
runcmd:
  - curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
  - chmod +x /usr/local/bin/docker-compose
  - usermod -aG docker azureuser
  - systemctl enable docker
  - systemctl start docker

# Create directories
  - mkdir -p /home/azureuser
  - chown azureuser:azureuser /home/azureuser

# Download your existing run.sh script
  - wget -O /home/azureuser/run.sh https://raw.githubusercontent.com/${github_user}/${repo_name}/${branch}/run.sh
  - chmod +x /home/azureuser/run.sh
  - chown azureuser:azureuser /home/azureuser/run.sh

# Create systemd service that runs your existing script
write_files:
  - path: /etc/systemd/system/${service_name}.service
    content: |
      [Unit]
      Description=Facebook Scraper Service
      After=docker.service
      Requires=docker.service
      
      [Service]
      Type=oneshot
      User=azureuser
      WorkingDirectory=/home/azureuser
      ExecStart=/home/azureuser/run.sh
      
      [Install]
      WantedBy=multi-user.target
    permissions: '0644'


  - systemctl daemon-reload
  - systemctl enable ${service_name}